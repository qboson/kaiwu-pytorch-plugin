name: CI

on:
  workflow_dispatch:
    inputs:
      all-kaiwu-versions:
        description: Test every supported Kaiwu release
        type: boolean
        default: false
  push:
    branches: [ main, develop, kaiwu-latest ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements/*.txt', 'example/**/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/devel.txt
          pip install .

      # 新增：依赖许可证检查步骤（核心）
      - name: Check dependency licenses
        run: |
          pip-licenses \
            -p numpy torch \
            --from=mixed \
            --format=json \
            --with-authors \
            --with-urls \
            --allow-only "MIT;LGPL;BSD;MPL;Apache;Unlicense;PSF" \
            --partial-match \
            --output-file dependency-licenses-${{ matrix.python-version }}.json  # 按 Python 版本保存结果（多版本矩阵场景）

      # 可选：上传许可证检查结果（便于归档查看）
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses-${{ matrix.python-version }}
          path: dependency-licenses-${{ matrix.python-version }}.json
          retention-days: 7  # 结果保留 7 天（可调整）

      - name: Lint with pylint
        run: |
          pylint src/ --disable=C0114,C0116

      - name: Test with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  kaiwu-compat:
    name: Kaiwu ${{ matrix.kaiwu-version }} interfaces
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Check both sides of the 1.4.0 interface change and the newest release.
        # The manual full run also covers the intermediate 1.4.1 and 1.4.2 releases.
        kaiwu-version: ${{ fromJSON(inputs.all-kaiwu-versions && '["1.3.1", "1.4.0", "1.4.1", "1.4.2", "1.4.3"]' || '["1.3.1", "1.4.0", "1.4.3"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/requirements.txt
      - name: Install CPU PyTorch and the selected SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kaiwu==${{ matrix.kaiwu-version }}" pytest==8.3.5 pytest-cov==6.1.1 scikit-learn==1.7.2 scipy==1.14.1 tqdm==4.67.1 .
          python -m pip check
      - name: Check the installed package
        run: |
          python -I -c "import sys; import kaiwu.torch_plugin as p; assert p.__file__.startswith(sys.prefix), p.__file__"
      - name: Test SDK interfaces and core models
        run: |
          python -m pytest tests/ --ignore=tests/test_example_dependencies.py --no-cov --junitxml=kaiwu-tests.xml
      - name: Upload SDK test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaiwu-tests-${{ matrix.kaiwu-version }}
          path: kaiwu-tests.xml
