name: CI

on:
  workflow_call:
    inputs:
      scope:
        type: string
        default: default
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope (each scope also runs the baseline combinations)
        type: choice
        options: [default, numpy, pytorch, kaiwu, platforms, all]
        default: default
      combination:
        description: Exact combination ID shown as the CI job name
        type: string
      all-kaiwu-versions:
        description: Include every supported Kaiwu release
        type: boolean
        default: false
  push:
    branches: [main, develop, kaiwu-sdk-compat, python-dependency-compat]
  pull_request:
    branches: [main]

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - name: Select compatibility combinations
        id: select
        env:
          SCOPE: ${{ inputs.scope || 'default' }}
          COMBINATION: ${{ inputs.combination }}
          ALL_KAIWU: ${{ inputs.all-kaiwu-versions }}
        run: |
          include=$(jq -ce --arg scope "$SCOPE" --arg id "$COMBINATION" --arg all_kaiwu "$ALL_KAIWU" '
            .defaults as $defaults | .python as $python | del(.defaults, .python) |
            .numpy = [$python | to_entries[] | .key as $py |
              .value.numpy_versions[] | {python: $py, numpy: .}] |
            map_values(map(
              $defaults + ($python[.python] | del(.numpy_versions)) + . |
              .id = "py\(.python)-\(.runner)-kaiwu\(.kaiwu)-np\(.numpy)-torch\(.torch)"
            )) |
            if $id != "" then
              [.[][] | select(.id == $id)] | if length == 1 then . else error("Expected one combination for: " + $id) end
            elif $scope == "all" then add
            else
              .default + (if $scope == "default" then [] else .[$scope] end) +
              (if $all_kaiwu == "true" and $scope != "kaiwu" then .kaiwu else [] end)
            end
          ' .github/compatibility-matrix.json)
          echo "include=$include" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.id }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            .github/compatibility-matrix.json
            requirements/*.txt
            example/**/requirements.txt
            pyproject.toml

      - name: Install and check dependencies
        env:
          KAIWU_VERSION: ${{ matrix.kaiwu }}
          NUMPY_VERSION: ${{ matrix.numpy }}
          TORCH_VERSION: ${{ matrix.torch }}
          SCIPY_VERSION: ${{ matrix.scipy }}
        run: |
          python -m pip install "torch==$TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . "numpy==$NUMPY_VERSION" "kaiwu==$KAIWU_VERSION" "scipy==$SCIPY_VERSION" \
            scikit-learn==1.7.2 seaborn==0.13.2 tqdm==4.67.1 \
            pytest==9.1.1 pytest-cov==7.1.0 pip-licenses==5.5.0 pylint==4.1.3
          python -m pip check
          python -I - <<'PY'
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path

          import kaiwu.torch_plugin as plugin

          assert Path(plugin.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          for package in ("kaiwu", "numpy", "torch"):
              assert version(package).split("+", 1)[0] == os.environ[f"{package.upper()}_VERSION"]
          PY

      - name: Check dependency licenses
        run: |
          pip-licenses -p numpy torch --from=mixed --format=json --with-authors --with-urls \
            --allow-only "MIT;LGPL;BSD;MPL;Apache;Unlicense;PSF" --partial-match \
            --output-file dependency-licenses.json

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses-${{ matrix.id }}
          path: dependency-licenses.json
          retention-days: 7

      - name: Lint with pylint
        if: matrix.lint
        run: python -m pylint src/

      - name: Test with pytest
        run: |
          installed=$(python -I -c 'from importlib.metadata import distribution; print(distribution("kaiwu-torch-plugin").locate_file("kaiwu/torch_plugin"))')
          python -I -m pytest tests/ -v \
            --cov=src --cov="$installed" --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && matrix.runner == 'ubuntu-24.04'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
