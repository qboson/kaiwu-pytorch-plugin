name: CI

on:
  workflow_dispatch:
    inputs:
      all-kaiwu-versions:
        description: Test every supported Kaiwu release
        type: boolean
        default: false
  push:
    branches: [main, develop, kaiwu-sdk-compat]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kaiwu-version: ${{ fromJSON(inputs.all-kaiwu-versions && '["1.3.1", "1.4.0", "1.4.1", "1.4.2", "1.4.3"]' || '["1.3.1", "1.4.0", "1.4.3"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py310-kaiwu${{ matrix.kaiwu-version }}-pip-${{ hashFiles('requirements/*.txt', 'example/**/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py310-kaiwu${{ matrix.kaiwu-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/devel.txt "kaiwu==${{ matrix.kaiwu-version }}" scikit-learn==1.7.2 scipy==1.14.1 tqdm==4.67.1
          pip install .
          python -m pip check
          python -I -c "import sys; import kaiwu.torch_plugin as p; assert p.__file__.startswith(sys.prefix), p.__file__"

      # 新增：依赖许可证检查步骤（核心）
      - name: Check dependency licenses
        run: |
          pip-licenses \
            -p numpy torch \
            --from=mixed \
            --format=json \
            --with-authors \
            --with-urls \
            --allow-only "MIT;LGPL;BSD;MPL;Apache;Unlicense;PSF" \
            --partial-match \
            --output-file dependency-licenses-${{ matrix.kaiwu-version }}.json  # 按 Kaiwu 版本保存结果（多版本矩阵场景）

      # 可选：上传许可证检查结果（便于归档查看）
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses-${{ matrix.kaiwu-version }}
          path: dependency-licenses-${{ matrix.kaiwu-version }}.json
          retention-days: 7 # 结果保留 7 天（可调整）

      - name: Lint with pylint
        run: |
          python -m pylint src/

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --cov=src \
            --cov="$(python -I -c 'from importlib.metadata import distribution; print(distribution("kaiwu-torch-plugin").locate_file("kaiwu/torch_plugin"))')" \
            --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
